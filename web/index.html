<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiracyFinder — r/Piracy Megathread Software Search</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>PiracyFinder</h1>
      <p class="sub">
        Federated search across the “Direct downloads” sites of the
        <a
          href="https://www.reddit.com/r/Piracy/wiki/megathread/software/"
          rel="noopener noreferrer"
          >r/Piracy software megathread</a
        >. Links only — nothing is hosted or mirrored here.
      </p>
      <form id="search-form" role="search">
        <label for="q">Search software across megathread sites</label>
        <div class="row">
          <input
            id="q"
            name="q"
            type="search"
            minlength="2"
            maxlength="150"
            required
            autocomplete="off"
            placeholder="e.g. photoshop, winrar, davinci resolve"
          />
          <button type="submit" id="go">Search</button>
          <button type="button" id="cancel" disabled>Cancel</button>
        </div>
      </form>
      <p id="live" role="status" aria-live="polite" class="live"></p>
      <section id="progress" aria-label="Per-source progress"></section>
      <section aria-label="Source filter">
        <fieldset id="filters">
          <legend>Filter by source</legend>
        </fieldset>
      </section>
      <section id="results" aria-label="Results"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
