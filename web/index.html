<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiracyFinder MVP — Open Source Metasearch</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Open Source Metasearch</h1>
      <p class="sub">
        Live federated search across GitHub, npm, and crates.io. No downloads, no piracy sources.
      </p>
      <form id="search-form" role="search">
        <label for="q">Search open source projects</label>
        <div class="row">
          <input
            id="q"
            name="q"
            type="search"
            minlength="2"
            maxlength="150"
            required
            autocomplete="off"
            placeholder="e.g. markdown parser"
          />
          <button type="submit" id="go">Search</button>
          <button type="button" id="cancel" disabled>Cancel</button>
        </div>
      </form>
      <p id="live" role="status" aria-live="polite" class="live"></p>
      <section id="progress" aria-label="Per-source progress"></section>
      <section aria-label="Source filter">
        <fieldset id="filters">
          <legend>Filter by source</legend>
        </fieldset>
      </section>
      <section id="results" aria-label="Results"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
